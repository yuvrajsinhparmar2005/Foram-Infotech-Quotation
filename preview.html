<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Quotation</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background: #525659; font-family: 'Noto Sans', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { position: sticky; top: 20px; background: white; padding: 10px 20px; border-radius: 50px; display: flex; gap: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn { padding: 8px 20px; border-radius: 20px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; text-decoration: none; font-size: 0.9rem; }
        .btn-edit { background: #f1f5f9; color: #333; }
        .btn-download { background: #10b981; color: white; }
        #invoice { width: 800px; min-height: 1122px; background: white; padding: 40px; position: relative; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 12px; }
        .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
        .tbl th { background: #eef2ff; border: 1px solid #000; padding: 8px; }
        .tbl td { border: 1px solid #000; padding: 8px; }
        .text-right { text-align: right; }
        .footer-content { display: flex; justify-content: space-between; margin-top: 20px; font-size: 11px; }
        .bank { border: 1px solid #000; padding: 10px; width: 55%; }
        .bottom { position: absolute; bottom: 30px; left: 40px; right: 40px; border-top: 2px solid #0062ff; text-align: center; font-size: 10px; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="controls">
        <a href="#" id="btn-edit" class="btn btn-edit"><span class="material-icons">edit</span> Edit</a>
        <button class="btn btn-download" onclick="downloadPDF()"><span class="material-icons">download</span> Download PDF</button>
        <a href="index.html" class="btn" style="background:#0062ff; color:white;">Back</a>
    </div>

    <div id="invoice">
        <div class="header">
            <div><img src="Foram-logo.jpg" style="width:100px;"></div>
            <div><img src="Foram-infotech-Name.jpg" style="width:200px;"></div>
        </div>

        <div class="grid">
            <div>
                <strong>To,</strong><br>
                <span id="p_client"></span><br>
                <span id="p_addr1"></span><br>
                <span id="p_addr2"></span>
            </div>
            <div style="text-align:right;">
                <div><strong>Invoice No:</strong> <span id="p_no"></span></div>
                <div><strong>Date:</strong> <span id="p_issue"></span></div>
                <!-- ADDED THIS LINE -->
                <div><strong>Valid Till:</strong> <span id="p_valid"></span></div>
            </div>
        </div>

        <table class="tbl">
            <thead>
                <tr>
                    <th>Description</th><th>Remarks</th><th>Qty</th><th>Price</th><th>Warranty</th><th>Total</th>
                </tr>
            </thead>
            <tbody id="p_table_body"></tbody>
            <tfoot>
                <tr>
                    <td colspan="5" class="text-right"><b>Grand Total</b></td>
                    <td class="text-right"><b id="p_grand"></b></td>
                </tr>
                <tr><td colspan="6"><b>In Words:</b> <span id="p_words"></span></td></tr>
            </tfoot>
        </table>

        <div class="footer-content">
            <div class="bank">
                <strong>Bank Details:</strong> HDFC Bank | A/c: 50200113927631 | IFSC: HDFC0009655
            </div>
            <div style="text-align:right;">for, <strong>FORAM INFOTECH</strong><br><br><br>Authorised Signatory</div>
        </div>

        <div class="bottom">Contact: +91 8866623434 | Ahmedabad</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const id = new URLSearchParams(window.location.search).get('id');
            const allQuotes = JSON.parse(localStorage.getItem('myQuotations')) || [];
            const q = allQuotes.find(x => x.id == id);
            if (!q) return;

            document.getElementById('btn-edit').href = `quotation.html?id=${id}`;
            document.getElementById('p_client').textContent = q.client;
            document.getElementById('p_addr1').textContent = q.addr1;
            document.getElementById('p_addr2').textContent = q.addr2;
            document.getElementById('p_no').textContent = q.quoteNo;
            document.getElementById('p_issue').textContent = q.issueDate;
            
            // MAP DATA TO PREVIEW
            document.getElementById('p_valid').textContent = q.validDate || 'N/A';

            const tbody = document.getElementById('p_table_body');
            q.items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.desc}</td><td>${item.remarks}</td>
                    <td style="text-align:center">${item.qty}</td>
                    <td class="text-right">${item.price}</td>
                    <td>${item.warr}</td>
                    <td class="text-right">${(item.qty * item.price).toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('p_grand').textContent = "₹ " + q.grandTotal;
            document.getElementById('p_words').textContent = q.amountWords;
        });

        function downloadPDF() {
            const element = document.getElementById('invoice');
            html2pdf().from(element).save('Quotation.pdf');
        }
    </script>
</body>
</html>
